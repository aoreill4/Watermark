<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DynaMark — AI-Resistant Dynamic Watermarking</title>
  <link rel="stylesheet" href="demo.css" />
</head>
<body>

<header>
  <h1>DynaMark</h1>
  <span class="badge">AI-Resistant Watermarking</span>
</header>

<div class="layout">

  <!-- LEFT: Live preview -->
  <div class="preview-pane">
    <div class="preview-toolbar">
      <div class="status">
        <div class="status-dot"></div>
        <span>Live watermark active</span>
      </div>
      <span id="frame-info">Frame —</span>
    </div>
    <div id="preview-container">
      <div class="placeholder" id="placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <span>Drop an image or use the sample below</span>
      </div>
    </div>
  </div>

  <!-- RIGHT: Config panel -->
  <div class="config-pane">

    <!-- Image source -->
    <div class="panel-section">
      <h3>Image Source</h3>
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="image/*" />
        Click or drag an image here
        <br/><small>or</small>
        <br/>
        <button class="close-btn" style="margin-top:8px" id="load-sample-btn">Load sample image</button>
      </div>
    </div>

    <!-- Watermark text -->
    <div class="panel-section">
      <h3>Watermark</h3>
      <div class="field">
        <label>Text</label>
        <input type="text" id="wm-text" value="CONFIDENTIAL" />
      </div>
      <div class="field">
        <label>Font size <span id="font-size-val">18px</span></label>
        <input type="range" id="font-size" min="10" max="48" value="18" />
      </div>
      <div class="field">
        <label>Opacity <span id="opacity-val">0.70</span></label>
        <input type="range" id="opacity" min="0.1" max="1" step="0.01" value="0.70" />
      </div>
      <div class="field">
        <label>Rotation <span id="rotation-val">−30°</span></label>
        <input type="range" id="rotation" min="-180" max="180" value="-30" />
      </div>
    </div>

    <!-- Motion -->
    <div class="panel-section">
      <h3>Motion</h3>
      <div class="field">
        <label>Path</label>
        <select id="path-select">
          <option value="lissajous">Lissajous (recommended)</option>
          <option value="lemniscate">Lemniscate (figure-8)</option>
          <option value="random">Random Walk</option>
        </select>
      </div>
      <div class="field">
        <label>Speed <span id="speed-val">1.0×</span></label>
        <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1.0" />
      </div>
      <div class="field">
        <label>FPS <span id="fps-val">30</span></label>
        <input type="range" id="fps" min="10" max="60" step="1" value="30" />
      </div>
    </div>

    <!-- Tiled ghost layer -->
    <div class="panel-section">
      <h3>Ghost Layer</h3>
      <div class="toggle-row">
        <label>Enabled</label>
        <label class="toggle">
          <input type="checkbox" id="tiled-enabled" checked />
          <span class="slider-track"></span>
        </label>
      </div>
      <div class="field">
        <label>Opacity <span id="tiled-opacity-val">0.07</span></label>
        <input type="range" id="tiled-opacity" min="0.01" max="0.3" step="0.01" value="0.07" />
      </div>
      <div class="field">
        <label>Spacing <span id="tiled-spacing-val">160px</span></label>
        <input type="range" id="tiled-spacing" min="60" max="400" step="10" value="160" />
      </div>
    </div>

    <!-- Color perturbation -->
    <div class="panel-section">
      <h3>Color Shift</h3>
      <div class="toggle-row">
        <label>Hue cycling</label>
        <label class="toggle">
          <input type="checkbox" id="color-perturb" checked />
          <span class="slider-track"></span>
        </label>
      </div>
      <div class="field">
        <label>Depth <span id="perturb-depth-val">20°</span></label>
        <input type="range" id="perturb-depth" min="0" max="90" step="1" value="20" />
      </div>
    </div>

    <!-- Attack simulator -->
    <div class="panel-section">
      <h3>Attack Simulator</h3>
      <p style="font-size:0.78rem;color:#475569;margin-bottom:12px;line-height:1.5">
        Demonstrate why common attacks fail against a dynamic watermark.
      </p>
      <div class="attack-btns">
        <button class="attack-btn" id="attack-screenshot">
          <span class="icon">📸</span>
          Try Screenshot
        </button>
        <button class="attack-btn" id="attack-average">
          <span class="icon">🎞</span>
          Try Frame Average (60 frames)
        </button>
        <button class="attack-btn" id="attack-extract">
          <span class="icon">🔓</span>
          Try Canvas Extraction
        </button>
      </div>
    </div>

  </div><!-- /config-pane -->
</div>

<!-- Result overlay -->
<div id="result-overlay">
  <h2 id="result-title">Attack Result</h2>
  <canvas id="result-canvas"></canvas>
  <p id="result-desc"></p>
  <button class="close-btn" id="close-overlay">Close</button>
</div>

<script type="module" src="demo.js"></script>
</body>
</html>
