<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DynaMark Live Demo — AI-Resistant Watermarking</title>

  <!-- Loads the bundled library from the same deployment. -->
  <script src="./dist/dynamark.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #131a2e 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: #64748b;
      font-size: 0.92rem;
      margin-top: 6px;
    }

    .cdn-source {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 12px;
      background: rgba(96, 165, 250, 0.1);
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 12px;
      font-size: 0.72rem;
      color: #60a5fa;
      font-family: 'SF Mono', Menlo, monospace;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      margin-top: 24px;
    }

    @media (max-width: 880px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* Preview */
    .preview {
      background: #06080f;
      border: 1px solid #1e2430;
      border-radius: 12px;
      overflow: hidden;
      min-height: 480px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .preview-bar {
      padding: 10px 16px;
      border-bottom: 1px solid #1e2430;
      font-size: 0.78rem;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .live-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse { 50% { opacity: 0.3; } }

    #preview-container {
      flex: 1;
      position: relative;
    }

    #preview-container canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #334155;
      gap: 12px;
      font-size: 0.9rem;
    }

    /* Controls */
    .controls {
      background: #0d1117;
      border: 1px solid #1e2430;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section h3 {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 10px;
    }

    .field { margin-bottom: 10px; }

    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .field label span {
      color: #60a5fa;
      font-variant-numeric: tabular-nums;
      font-size: 0.75rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
    }

    input[type="text"], select {
      width: 100%;
      background: #1e2430;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.84rem;
      padding: 7px 10px;
      outline: none;
    }

    input[type="text"]:focus, select:focus { border-color: #3b82f6; }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }

    .btn.secondary {
      background: #1e2430;
      border: 1px solid #2d3748;
      color: #94a3b8;
    }

    .attack-grid {
      display: grid;
      gap: 6px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-row label {
      font-size: 0.82rem;
      color: #94a3b8;
    }

    .toggle {
      position: relative;
      width: 36px; height: 20px;
    }
    .toggle input { opacity: 0; }
    .track {
      position: absolute; inset: 0;
      background: #2d3748; border-radius: 20px;
      cursor: pointer; transition: background 0.2s;
    }
    .toggle input:checked + .track { background: #3b82f6; }
    .track::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: white; border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .track::before { transform: translateX(16px); }

    .file-input { display: none; }

    .drop {
      border: 2px dashed #2d3748;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s;
    }

    .drop:hover, .drop.over { border-color: #3b82f6; color: #60a5fa; }

    /* Result modal */
    .modal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .modal h2 { font-size: 1.1rem; }
    .modal p {
      max-width: 500px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .modal canvas {
      max-width: 80vw;
      max-height: 60vh;
      border-radius: 6px;
      border: 1px solid #2d3748;
    }

    .loading-banner {
      background: #1a3a5c;
      color: #60a5fa;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.82rem;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }

    .loading-banner.show { display: block; }
  </style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>DynaMark</h1>
    <p>AI-resistant dynamic watermarking — live demo loaded from GitHub</p>
    <div class="cdn-source" id="cdn-source">Loading…</div>
  </header>

  <div id="error-banner" class="loading-banner"></div>

  <div class="grid">

    <!-- LEFT: Live preview -->
    <div class="preview">
      <div class="preview-bar">
        <span><span class="live-dot"></span>Live watermark active</span>
        <span id="frame-info">Frame —</span>
      </div>
      <div id="preview-container">
        <div class="placeholder" id="placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>Load the sample image or drop your own to start</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: Controls -->
    <div class="controls">

      <div class="section">
        <h3>Image</h3>
        <button class="btn" id="sample-btn">Load Sample Image</button>
        <label class="drop" id="drop" style="margin-top:8px">
          <input type="file" id="file-input" class="file-input" accept="image/*" />
          or drop your own here
        </label>
      </div>

      <div class="section">
        <h3>Watermark</h3>
        <div class="field">
          <input type="text" id="text" value="CONFIDENTIAL" />
        </div>
        <div class="field">
          <label>Opacity <span id="opacity-v">0.70</span></label>
          <input type="range" id="opacity" min="0.1" max="1" step="0.01" value="0.70" />
        </div>
        <div class="field">
          <label>Font size <span id="fontsize-v">22px</span></label>
          <input type="range" id="fontsize" min="10" max="48" value="22" />
        </div>
      </div>

      <div class="section">
        <h3>Motion</h3>
        <div class="field">
          <select id="path">
            <option value="lissajous">Lissajous (recommended)</option>
            <option value="lemniscate">Lemniscate (figure-8)</option>
            <option value="random">Random walk</option>
          </select>
        </div>
        <div class="field">
          <label>Speed <span id="speed-v">1.0×</span></label>
          <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1.0" />
        </div>
      </div>

      <div class="section">
        <h3>Ghost Layer</h3>
        <div class="toggle-row" style="margin-bottom:10px">
          <label>Enabled</label>
          <label class="toggle">
            <input type="checkbox" id="tiled" checked />
            <span class="track"></span>
          </label>
        </div>
        <div class="field">
          <label>Opacity <span id="tiled-opacity-v">0.07</span></label>
          <input type="range" id="tiled-opacity" min="0.01" max="0.3" step="0.01" value="0.07" />
        </div>
      </div>

      <div class="section">
        <h3>Try Attacks</h3>
        <div class="attack-grid">
          <button class="btn secondary" id="attack-shot">📸 Screenshot</button>
          <button class="btn secondary" id="attack-avg">🎞 Frame Average (60)</button>
          <button class="btn secondary" id="attack-extract">🔓 Canvas Extract</button>
        </div>
      </div>

    </div>

  </div>

</div>

<!-- Result modal -->
<div class="modal" id="modal">
  <h2 id="modal-title">Result</h2>
  <canvas id="modal-canvas"></canvas>
  <p id="modal-desc"></p>
  <button class="btn" style="max-width:200px" id="modal-close">Close</button>
</div>

<script>
(function() {
  const REPO = 'aoreill4/Watermark';
  const BRANCH = 'claude/ai-resistant-watermark-mIdJt';
  document.getElementById('cdn-source').textContent = `${REPO}@${BRANCH}`;

  // Wait until the global DynaMark is available
  function ready(cb) {
    if (typeof DynaMark !== 'undefined') return cb();
    let tries = 0;
    const t = setInterval(() => {
      tries++;
      if (typeof DynaMark !== 'undefined') {
        clearInterval(t);
        cb();
      } else if (tries > 50) {
        clearInterval(t);
        const banner = document.getElementById('error-banner');
        banner.textContent = 'Failed to load DynaMark from CDN. Make sure dist/ is committed and pushed.';
        banner.classList.add('show');
      }
    }, 100);
  }

  ready(initDemo);

  function initDemo() {
    let engine = null;

    function getConfig() {
      return {
        text: document.getElementById('text').value || 'CONFIDENTIAL',
        font: `bold ${document.getElementById('fontsize').value}px Arial, sans-serif`,
        opacity: parseFloat(document.getElementById('opacity').value),
        path: document.getElementById('path').value,
        speed: parseFloat(document.getElementById('speed').value),
        tiledEnabled: document.getElementById('tiled').checked,
        tiledOpacity: parseFloat(document.getElementById('tiled-opacity').value),
        onFrame: ({ frame }) => {
          document.getElementById('frame-info').textContent = `Frame ${frame}`;
        },
      };
    }

    function start(src) {
      if (engine) engine.destroy();
      document.getElementById('placeholder').style.display = 'none';
      const ctor = window.DynaMark.DynaMark || window.DynaMark;
      engine = new ctor(document.getElementById('preview-container'), getConfig());
      engine.setImage(src).then(() => engine.start());
      window._engine = engine;
    }

    // Sample image generator
    document.getElementById('sample-btn').addEventListener('click', () => {
      const c = document.createElement('canvas');
      c.width = 800; c.height = 500;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 800, 500);
      grad.addColorStop(0, '#1a237e'); grad.addColorStop(0.4, '#0288d1');
      grad.addColorStop(0.7, '#4caf50'); grad.addColorStop(1, '#8d6e63');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 800, 500);
      ctx.beginPath(); ctx.arc(640, 120, 60, 0, 2*Math.PI);
      ctx.fillStyle = 'rgba(255,235,59,0.9)'; ctx.fill();
      for (const [cx, cy] of [[150,80],[400,60],[600,100]]) {
        ctx.beginPath();
        ctx.arc(cx, cy, 40, 0, 2*Math.PI);
        ctx.arc(cx+40, cy-10, 30, 0, 2*Math.PI);
        ctx.arc(cx+70, cy, 35, 0, 2*Math.PI);
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
      }
      ctx.beginPath();
      ctx.moveTo(0,320); ctx.lineTo(120,180); ctx.lineTo(240,300);
      ctx.lineTo(350,150); ctx.lineTo(480,290); ctx.lineTo(600,160);
      ctx.lineTo(720,260); ctx.lineTo(800,200); ctx.lineTo(800,500); ctx.lineTo(0,500);
      ctx.fillStyle = '#2e7d32'; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.font = 'bold 18px Arial';
      ctx.fillText('DynaMark — protected sample', 20, 480);
      start(c.toDataURL('image/png'));
    });

    // File input
    const fileInput = document.getElementById('file-input');
    document.getElementById('drop').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) start(URL.createObjectURL(e.target.files[0]));
    });
    const drop = document.getElementById('drop');
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) start(URL.createObjectURL(f));
    });

    // Live updates
    const updateLive = () => engine && engine.update(getConfig());
    ['text','opacity','fontsize','path','speed','tiled','tiled-opacity'].forEach((id) => {
      document.getElementById(id).addEventListener('input', () => {
        const map = {
          'opacity': 'opacity-v',
          'fontsize': 'fontsize-v',
          'speed': 'speed-v',
          'tiled-opacity': 'tiled-opacity-v',
        };
        const dispId = map[id];
        if (dispId) {
          const v = document.getElementById(id).value;
          const fmt = id === 'fontsize' ? `${v}px`
            : id === 'speed' ? `${parseFloat(v).toFixed(1)}×`
            : parseFloat(v).toFixed(2);
          document.getElementById(dispId).textContent = fmt;
        }
        updateLive();
      });
      document.getElementById(id).addEventListener('change', updateLive);
    });

    // ─ Attacks ─
    function showResult(title, sourceCanvas, desc) {
      const m = document.getElementById('modal');
      const out = document.getElementById('modal-canvas');
      out.width = sourceCanvas.width;
      out.height = sourceCanvas.height;
      out.getContext('2d').drawImage(sourceCanvas, 0, 0);
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-desc').textContent = desc;
      m.classList.add('show');
    }

    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('show');
    });

    document.getElementById('attack-shot').addEventListener('click', () => {
      if (!engine) return alert('Load an image first.');
      const live = document.querySelector('#preview-container canvas');
      const snap = document.createElement('canvas');
      snap.width = live.width; snap.height = live.height;
      snap.getContext('2d').drawImage(live, 0, 0);
      showResult(
        '📸 Screenshot — Watermark Captured',
        snap,
        'The screenshot caught the watermark exactly where it was. Because the watermark is always somewhere on screen and the ghost layer covers everything, no clean screenshot exists.'
      );
    });

    document.getElementById('attack-avg').addEventListener('click', async () => {
      if (!engine) return alert('Load an image first.');
      const btn = document.getElementById('attack-avg');
      const orig = btn.textContent;
      btn.textContent = 'Capturing 60 frames…';
      btn.disabled = true;

      const live = document.querySelector('#preview-container canvas');
      const w = live.width, h = live.height;
      const acc = new Float32Array(w * h * 4);
      for (let i = 0; i < 60; i++) {
        await new Promise((r) => requestAnimationFrame(r));
        const d = live.getContext('2d').getImageData(0, 0, w, h).data;
        for (let j = 0; j < d.length; j++) acc[j] += d[j];
      }
      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      const oc = out.getContext('2d');
      const img = oc.createImageData(w, h);
      for (let j = 0; j < img.data.length; j++) {
        img.data[j] = j % 4 === 3 ? 255 : Math.round(acc[j] / 60);
      }
      oc.putImageData(img, 0, 0);

      btn.textContent = orig;
      btn.disabled = false;

      showResult(
        '🎞 Frame Average — Watermark Survives',
        out,
        'Averaging 60 frames produces a visible Lissajous trace from the moving watermark and the ghost layer remains fully visible. An attacker cannot recover a clean image this way.'
      );
    });

    document.getElementById('attack-extract').addEventListener('click', () => {
      if (!engine) return alert('Load an image first.');
      const dataUrl = engine.export('image/png');
      const i = new Image();
      i.onload = () => {
        const c = document.createElement('canvas');
        c.width = i.width; c.height = i.height;
        c.getContext('2d').drawImage(i, 0, 0);
        showResult(
          '🔓 Canvas Extract — Watermark Burned In',
          c,
          'The exported image contains the watermark burned into the frame. In production, CanvasGuard would block this entirely or return a heavily-watermarked composite.'
        );
      };
      i.src = dataUrl;
    });
  }
})();
</script>
</body>
</html>
