<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DynaMark — AI-Resistant Watermarking</title>
  <script src="./dist/dynamark.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #080c14;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      flex-shrink: 0;
      padding: 14px 24px;
      border-bottom: 1px solid #1a2030;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 8px;
      background: rgba(96,165,250,0.12);
      color: #60a5fa;
      border-radius: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .live-dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
      margin-left: auto;
    }
    @keyframes pulse { 50% { opacity: 0.2; } }

    .layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Preview */
    #preview-container {
      flex: 1;
      position: relative;
      background: #04060a;
    }

    #preview-container canvas {
      position: absolute !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* Drop hint when no image */
    #drop-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #2a3448;
      font-size: 0.9rem;
      pointer-events: none;
    }

    #drop-overlay svg { opacity: 0.25; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: #0b0f1a;
      border-left: 1px solid #1a2030;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .section {
      padding: 16px;
      border-bottom: 1px solid #141a28;
    }

    .section h3 {
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #3a4a6a;
      margin-bottom: 12px;
    }

    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }

    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #7a8eaa;
      margin-bottom: 4px;
    }

    .field label span {
      color: #60a5fa;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    input[type="text"] {
      width: 100%;
      background: #141c2c;
      border: 1px solid #1e2a40;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.82rem;
      padding: 7px 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #3b82f6; }

    /* File drop area */
    .drop-area {
      border: 1.5px dashed #1e2a40;
      border-radius: 8px;
      padding: 14px 10px;
      text-align: center;
      font-size: 0.78rem;
      color: #3a4a6a;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .drop-area:hover, .drop-area.over {
      border-color: #3b82f6;
      color: #60a5fa;
    }
    .drop-area input { display: none; }

    /* Attack buttons */
    .attacks { display: flex; flex-direction: column; gap: 6px; }

    .atk {
      background: #0e1525;
      border: 1px solid #1e2a40;
      border-radius: 6px;
      color: #7a8eaa;
      font-size: 0.78rem;
      padding: 8px 10px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: border-color 0.15s, color 0.15s;
    }
    .atk:hover { border-color: #ef4444; color: #f87171; }

    /* Frame counter */
    #frame-count {
      font-size: 0.7rem;
      color: #1e2a40;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      padding: 24px;
    }
    .modal.show { display: flex; }
    .modal h2 { font-size: 1rem; }
    .modal p {
      max-width: 460px;
      text-align: center;
      color: #7a8eaa;
      font-size: 0.82rem;
      line-height: 1.55;
    }
    .modal canvas {
      max-width: 80vw;
      max-height: 55vh;
      border-radius: 6px;
      border: 1px solid #1e2a40;
    }
    .close-btn {
      background: #141c2c;
      border: 1px solid #1e2a40;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 8px 22px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .close-btn:hover { background: #1e2a40; }
  </style>
</head>
<body>

<header>
  <h1>DynaMark</h1>
  <span class="badge">AI-Resistant</span>
  <span id="frame-count">—</span>
  <span class="live-dot"></span>
</header>

<div class="layout">

  <!-- Preview -->
  <div id="preview-container">
    <div id="drop-overlay">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <span>Drop an image to start</span>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">

    <div class="section">
      <h3>Image</h3>
      <label class="drop-area" id="drop-area">
        <input type="file" id="file-input" accept="image/*" />
        Drop or click to upload
      </label>
    </div>

    <div class="section">
      <h3>Spotlight</h3>
      <div class="field">
        <label>Window size <span id="radius-v">50%</span></label>
        <input type="range" id="radius" min="0.15" max="0.70" step="0.01" value="0.50" />
      </div>
      <div class="field">
        <label>Edge softness <span id="feather-v">0.75</span></label>
        <input type="range" id="feather" min="0.10" max="0.95" step="0.01" value="0.75" />
      </div>
      <div class="field">
        <label>Speed <span id="speed-v">1.0×</span></label>
        <input type="range" id="speed" min="0.1" max="4" step="0.1" value="1.0" />
      </div>
    </div>

    <div class="section">
      <h3>Watermark text</h3>
      <div class="field">
        <input type="text" id="wm-text" placeholder="Leave blank for none" value="" />
      </div>
    </div>

    <div class="section">
      <h3>Attack simulator</h3>
      <p style="font-size:0.73rem;color:#2e3d56;line-height:1.5;margin-bottom:10px">
        Prove common attacks fail against a dynamic spotlight.
      </p>
      <div class="attacks">
        <button class="atk" id="atk-shot">📸 Screenshot (current frame)</button>
        <button class="atk" id="atk-avg">🎞 Frame average (60 frames)</button>
        <button class="atk" id="atk-extract">🔓 Canvas extraction</button>
      </div>
    </div>

  </div>

</div>

<!-- Result modal -->
<div class="modal" id="modal">
  <h2 id="modal-title"></h2>
  <canvas id="modal-canvas"></canvas>
  <p id="modal-desc"></p>
  <button class="close-btn" id="modal-close">Close</button>
</div>

<script>
(function () {
  let engine = null;

  // ── Sample image generator ──────────────────────────────────────────────
  function buildSampleCanvas() {
    const c = document.createElement('canvas');
    c.width = 1200; c.height = 750;
    const ctx = c.getContext('2d');

    // Sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, 420);
    sky.addColorStop(0, '#0d1b4b');
    sky.addColorStop(0.5, '#1a3a7c');
    sky.addColorStop(1, '#e07b54');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 1200, 420);

    // Sun / moon
    const glow = ctx.createRadialGradient(900, 200, 0, 900, 200, 120);
    glow.addColorStop(0, 'rgba(255,220,100,1)');
    glow.addColorStop(0.4, 'rgba(255,160,50,0.6)');
    glow.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, 1200, 500);

    // Ocean
    const ocean = ctx.createLinearGradient(0, 420, 0, 750);
    ocean.addColorStop(0, '#1a4060');
    ocean.addColorStop(1, '#0a1828');
    ctx.fillStyle = ocean; ctx.fillRect(0, 420, 1200, 330);

    // Reflection stripe
    const ref = ctx.createLinearGradient(840, 0, 960, 0);
    ref.addColorStop(0, 'rgba(255,200,80,0)');
    ref.addColorStop(0.5, 'rgba(255,200,80,0.35)');
    ref.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = ref; ctx.fillRect(0, 420, 1200, 330);

    // Horizon city silhouette
    ctx.fillStyle = '#0b1528';
    for (const [x, w, h] of [
      [0,80,120],[80,60,90],[140,100,160],[240,50,100],[290,80,140],
      [370,60,80],[430,110,200],[540,70,120],[610,90,170],[700,60,90],
      [760,120,180],[880,80,130],[960,100,150],[1060,70,100],[1130,70,110],
    ]) {
      ctx.fillRect(x, 420 - h, w, h + 5);
    }

    // Stars
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i = 0; i < 80; i++) {
      const sx = Math.random() * 1200;
      const sy = Math.random() * 280;
      ctx.fillRect(sx, sy, Math.random() < 0.3 ? 2 : 1, Math.random() < 0.3 ? 2 : 1);
    }

    return c;
  }

  // ── Engine init ─────────────────────────────────────────────────────────
  function getConfig() {
    return {
      path: 'lissajous',
      speed: parseFloat(document.getElementById('speed').value),
      spotlightRadius: parseFloat(document.getElementById('radius').value),
      spotlightFeather: parseFloat(document.getElementById('feather').value),
      text: document.getElementById('wm-text').value,
      onFrame: ({ frame }) => {
        document.getElementById('frame-count').textContent = `frame ${frame}`;
      },
    };
  }

  function startEngine(src) {
    if (engine) engine.destroy();
    document.getElementById('drop-overlay').style.display = 'none';
    const Ctor = window.DynaMark && (window.DynaMark.DynaMark || window.DynaMark);
    engine = new Ctor(document.getElementById('preview-container'), getConfig());
    engine.setImage(src).then(() => engine.start());
    window._engine = engine;
  }

  // Auto-load the sample image immediately
  startEngine(buildSampleCanvas().toDataURL('image/png'));

  // ── File upload / drop ──────────────────────────────────────────────────
  const dropArea = document.getElementById('drop-area');
  const fileInput = document.getElementById('file-input');

  dropArea.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) startEngine(URL.createObjectURL(e.target.files[0]));
  });

  const previewEl = document.getElementById('preview-container');
  previewEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropArea.classList.add('over');
  });
  previewEl.addEventListener('dragleave', () => dropArea.classList.remove('over'));
  previewEl.addEventListener('drop', (e) => {
    e.preventDefault();
    dropArea.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) startEngine(URL.createObjectURL(f));
  });

  // ── Live controls ────────────────────────────────────────────────────────
  function bindSlider(id, displayId, fmt) {
    document.getElementById(id).addEventListener('input', function () {
      document.getElementById(displayId).textContent = fmt(this.value);
      if (engine) engine.update(getConfig());
    });
  }

  bindSlider('radius',  'radius-v',  v => `${Math.round(parseFloat(v) * 100)}%`);
  bindSlider('feather', 'feather-v', v => parseFloat(v).toFixed(2));
  bindSlider('speed',   'speed-v',   v => `${parseFloat(v).toFixed(1)}×`);

  document.getElementById('wm-text').addEventListener('input', () => {
    if (engine) engine.update(getConfig());
  });

  // ── Attack simulator ─────────────────────────────────────────────────────
  function showModal(title, srcCanvas, desc) {
    const out = document.getElementById('modal-canvas');
    out.width = srcCanvas.width;
    out.height = srcCanvas.height;
    out.getContext('2d').drawImage(srcCanvas, 0, 0);
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-desc').textContent = desc;
    document.getElementById('modal').classList.add('show');
  }

  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal').classList.remove('show');
  });

  document.getElementById('atk-shot').addEventListener('click', () => {
    if (!engine) return;
    const live = document.querySelector('#preview-container canvas');
    const snap = document.createElement('canvas');
    snap.width = live.width; snap.height = live.height;
    snap.getContext('2d').drawImage(live, 0, 0);
    showModal(
      '📸 Screenshot — only the spotlight window is recoverable',
      snap,
      'A screenshot captures only the small clear window at this instant. The rest of the image shows the tile-scrambled decoy, not the real content. To reconstruct the full image an attacker would need to stitch dozens of screenshots with precise alignment.'
    );
  });

  document.getElementById('atk-avg').addEventListener('click', async () => {
    if (!engine) return;
    const btn = document.getElementById('atk-avg');
    btn.textContent = 'Capturing…';
    btn.disabled = true;

    const live = document.querySelector('#preview-container canvas');
    const w = live.width, h = live.height;
    const acc = new Float32Array(w * h * 4);

    for (let i = 0; i < 60; i++) {
      await new Promise(r => requestAnimationFrame(r));
      const d = live.getContext('2d').getImageData(0, 0, w, h).data;
      for (let j = 0; j < d.length; j++) acc[j] += d[j];
    }

    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    const oc = out.getContext('2d');
    const img = oc.createImageData(w, h);
    for (let j = 0; j < img.data.length; j++) {
      img.data[j] = j % 4 === 3 ? 255 : Math.round(acc[j] / 60);
    }
    oc.putImageData(img, 0, 0);

    btn.textContent = '🎞 Frame average (60 frames)';
    btn.disabled = false;

    showModal(
      '🎞 Frame average — Lissajous trace, not a clean image',
      out,
      'Averaging 60 frames produces the Lissajous path of the spotlight as a bright smear over the scrambled decoy. The real image structure never accumulates enough exposure to be reconstructed.'
    );
  });

  document.getElementById('atk-extract').addEventListener('click', () => {
    if (!engine) return;
    const url = engine.export();
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      showModal(
        '🔓 Canvas extraction — watermark burned into frame',
        c,
        'canvas.toDataURL() returns exactly what is visible at this moment — the decoy outside the spotlight and the real image only within it. Without recording the animation there is no way to recover the full image from a single extraction.'
      );
    };
    img.src = url;
  });
})();
</script>
</body>
</html>
